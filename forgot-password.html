<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – AURA</title>
  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- JS -->
  <script src="js/auth.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="login-page">

<!-- ================= HEADER (LOGO ONLY) ================= -->
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo-link">
      <img src="assets/logo.svg" alt="AURA Logo" class="logo">
    </a>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main>
  <div class="container" style="max-width:420px; margin-top:3rem;">
    <div class="card">
      <h1 style="margin-bottom:0.75rem;">Reset Password</h1>
      <p style="font-size:0.9rem; color:#555; margin-bottom:1.5rem;">
        Enter your registered email address and we'll send you instructions to reset your password.
      </p>

      <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
        <div style="margin-bottom:1.2rem;">
          <label>Email Address</label>
          <input type="email" id="resetEmail"
                 placeholder="name@example.com"
                 style="width:100%; padding:0.6rem;" required>
        </div>

        <button type="submit" class="btn-primary" style="width:100%;">
          Send Reset Instructions
        </button>
      </form>

      <div id="resetFeedback" style="display:none; margin-top:1.2rem; padding:12px; background:#e6f4ea; border:1px solid #b7e1cd; border-radius:8px; font-size:0.9rem; color:#137333;">
        Password reset instructions have been sent to your email. Check your inbox to proceed.
      </div>

      <p style="margin-top:1.5rem; font-size:0.9rem; text-align:center;">
        Remembered your password?
        <a href="login.html" style="color:#00412E; font-weight:600; text-decoration:none;">
          Back to Login
        </a>
      </p>
    </div>
  </div>
</main>

<script>
  function handleForgotPassword(e) {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) return;
    document.getElementById('resetFeedback').style.display = 'block';
    document.getElementById('forgotPasswordForm').style.display = 'none';
  }
</script>

</body>
</html>
